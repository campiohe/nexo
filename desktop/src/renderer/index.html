<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Owner: workstream B. Strict CSP for dev and prod. The dev-only react-refresh preamble is inlined by
         Vite *above* this tag, so it is not subject to it. connect-src stays open to any http(s)/ws(s) host because
         the Nexo server and LiveKit URLs are user-entered; img-src allows http(s) for the same reason (profile
         pictures are served by the Nexo server at GET /avatars/:userId). 'wasm-unsafe-eval' lets the RNNoise noise
         suppressor compile its WebAssembly (SPEC §13.3); it allows WASM only, not eval(). Its AudioWorklet module
         loads from 'self'. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; font-src 'self' data:; media-src 'self' blob: mediastream:; connect-src 'self' http: https: ws: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <title>Nexo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
