# Owner: workstream B. Packaging for Nexo (electron-builder). Run from desktop/: npm run dist[:win|:mac|:linux]
appId: app.nexo.desktop
productName: Nexo
copyright: Copyright © 2026 Nexo
# electron is hoisted to the workspace root, where electron-builder can't resolve the installed version.
# Keep in sync with node_modules/electron/package.json when upgrading Electron.
electronVersion: 45.2.3
directories:
  output: release
  buildResources: build

# main/preload/renderer are bundled by electron-vite into out/. The renderer's npm "dependencies"
# (react, livekit-client, socket.io-client, zustand) are inlined by Vite. The one runtime exception is
# uiohook-napi (global push-to-talk), which main require()s lazily: it ships N-API prebuilds loaded by
# node-gyp-build, so it and node-gyp-build are the only node_modules packed. electron-builder collects
# production dependencies itself (also from the hoisted workspace root) and applies only the "!" patterns
# below to them, so every other package is excluded by name pattern rather than re-included.
#
# A platform section's `files` REPLACES this list (it isn't appended), so win/mac/linux each repeat it
# plus one line dropping the other OSes' uiohook prebuilds. (${platform} can't be used here: it expands to
# the build host's OS, not the target's, which breaks `--win` builds from WSL.) Keep the copies in sync.
files:
  - package.json
  - out/**
  - resources/icon.png
  - '!**/*.map'
  - '!node_modules/!(uiohook-napi|node-gyp-build){,/**}'
  # uiohook-napi: only dist/ + prebuilds are needed at runtime, not the C sources.
  - '!node_modules/uiohook-napi/{binding.gyp,libuiohook,src}{,/**}'
asarUnpack:
  - resources/**
  # Native addons can't be dlopen()ed from inside app.asar; Electron redirects require() to app.asar.unpacked.
  - node_modules/uiohook-napi/prebuilds/**
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

# Auto-update (src/main/updater.ts). electron-updater is a devDependency on purpose: electron-vite then
# bundles it into out/main instead of externalizing it, so it needs no node_modules entry above.
# This writes resources/app-update.yml into the app and latest.yml / latest-mac.yml / latest-linux.yml
# (plus .blockmap files) next to the installers. CI builds with `--publish never`; the release job uploads
# those files with the installers. electron-updater builds download URLs from the artifact names, so they
# must match the uploaded file names exactly (no spaces).
publish:
  provider: github
  owner: campiohe
  repo: nexo

win:
  target:
    - target: nsis
      arch: [x64]
  files:
    - package.json
    - out/**
    - resources/icon.png
    - '!**/*.map'
    - '!node_modules/!(uiohook-napi|node-gyp-build){,/**}'
    - '!node_modules/uiohook-napi/{binding.gyp,libuiohook,src}{,/**}'
    - '!node_modules/uiohook-napi/prebuilds/!(win32-${arch}){,/**}'
  # The native share helper (docs/SPEC-BETA.md §9.4): nexo-media.exe plus its DLLs, built into native/out by
  # the release workflow (or scripts/native-build.sh). Lands in <install>/resources/native/, outside the asar,
  # where src/main/native-media/index.ts looks for it. Windows only, so it lives here and not at the top level
  # (and if a top-level extraResources is ever added, this list replaces it for Windows: repeat its entries).
  extraResources:
    - from: ../native/out
      to: native
      # gpu-burn and queue-probe are benchmark tools (native/tools), not part of the app.
      filter: ['**/*', '!gpu-burn.exe', '!queue-probe.exe']
  icon: resources/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Nexo
  artifactName: ${productName}-Setup-${version}.${ext}
  uninstallDisplayName: ${productName}

mac:
  target:
    - target: dmg
      arch: [universal]
  # Both darwin prebuilds go into both the x64 and arm64 builds (node-gyp-build picks one by process.arch at
  # runtime). They are single-arch and identical across the two builds, which @electron/universal only
  # accepts for files matched by x64ArchFiles.
  files:
    - package.json
    - out/**
    - resources/icon.png
    - '!**/*.map'
    - '!node_modules/!(uiohook-napi|node-gyp-build){,/**}'
    - '!node_modules/uiohook-napi/{binding.gyp,libuiohook,src}{,/**}'
    - '!node_modules/uiohook-napi/prebuilds/!(darwin-*){,/**}'
  x64ArchFiles: '**/node_modules/uiohook-napi/prebuilds/darwin-*/*.node'
  icon: resources/icon.png
  category: public.app-category.social-networking
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  extendInfo:
    NSMicrophoneUsageDescription: Nexo uses the microphone for voice chat.
    NSCameraUsageDescription: Nexo uses the camera for video in voice channels.
    NSScreenCaptureUsageDescription: Nexo needs screen recording access to share your screen or a window.
    NSAudioCaptureUsageDescription: Nexo can include system audio when you share your screen.
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64]
  files:
    - package.json
    - out/**
    - resources/icon.png
    - '!**/*.map'
    - '!node_modules/!(uiohook-napi|node-gyp-build){,/**}'
    - '!node_modules/uiohook-napi/{binding.gyp,libuiohook,src}{,/**}'
    - '!node_modules/uiohook-napi/prebuilds/!(linux-${arch}){,/**}'
  icon: resources/icon.png
  executableName: nexo
  category: Network
  synopsis: Chat, voice and screen sharing for friend groups
  maintainer: Nexo
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
