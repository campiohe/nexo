name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # The Windows job also builds the native helper.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # update-info: the electron-updater metadata file each OS writes next to its installer.
          - name: windows
            os: windows-latest
            builder-args: --win
            update-info: latest.yml
          - name: macos
            os: macos-latest
            # Unsigned, but ad-hoc signed so the app launches on Apple Silicon.
            builder-args: --mac -c.mac.identity=-
            update-info: latest-mac.yml
          - name: linux
            os: ubuntu-latest
            builder-args: --linux
            update-info: latest-linux.yml
    env:
      # The packaged app doesn't need the electron npm binary: electron-builder downloads its own Electron.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # No Apple certificate: don't look for a signing identity in the keychain.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7

      # The app's version decides its update lane (alpha, beta, stable or test: docs/DEVELOPMENT.md "Test builds"), so a
      # tag must match it. Manual runs (workflow_dispatch) build whatever version the branch has.
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::tag $TAG doesn't match desktop/package.json version $version"
            exit 1
          fi
          # The server download carries the same version (nexo-server update compares it).
          server=$(node -p "require('./server-cli/package.json').version")
          if [[ "$server" != "$version" ]]; then
            echo "::error::server-cli/package.json is $server, desktop is $version: bump both"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Test (server, server CLI)
        if: runner.os == 'Linux'
        run: npm test

      - name: Build desktop app
        run: npm run build -w desktop

      # Native share helper nexo-media.exe (docs/SPEC-BETA.md §9.4), Windows only: build, unit-test and
      # install it into native/out, which electron-builder.yml ships as <install>/resources/native.
      - name: MSVC environment (native helper)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # pwsh, not bash: Git Bash's /usr/bin/link would shadow MSVC's link.exe.
      - name: Build native helper
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: native/nexo-media
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # Release builds report the app's version in capabilities (dev builds say <project version>-dev).
          $version = (Get-Content ../../desktop/package.json -Raw | ConvertFrom-Json).version
          cmake --preset windows-release "-DNEXO_MEDIA_VERSION=$version"
          cmake --build --preset windows-release
          ctest --preset windows-release
          cmake --install build/windows-release --prefix ../out

      # The exe must start (all DLLs present). The selftest itself may fail on a runner without a GPU
      # encoder, so only a crash before any output, or a hang, fails the job.
      - name: Check native helper
        if: runner.os == 'Windows'
        run: |
          if [[ ! -f native/out/nexo-media.exe ]]; then
            echo "::error::native/out/nexo-media.exe is missing"
            exit 1
          fi
          ls -la native/out
          code=0
          out="$(timeout 60 native/out/nexo-media.exe --selftest 2>selftest.err)" || code=$?
          echo "$out"
          cat selftest.err
          if [[ $code == 124 ]]; then
            echo "::error::nexo-media.exe --selftest hung"
            exit 1
          fi
          if [[ -z "$out" ]]; then
            echo "::error::nexo-media.exe --selftest printed nothing (exit $code): it did not start (missing DLL?)"
            exit 1
          fi
          if [[ $code != 0 ]]; then
            echo "::warning::nexo-media.exe --selftest exited with $code (expected on a runner without a hardware encoder)"
          fi

      # The server download (docs/SPEC-SERVER-CLI.md §8): nexo-server.exe (Node single executable with the
      # Nexo server) + livekit-server.exe, both pinned and checksum-verified by server-cli/scripts/*.lock.
      # A flat zip (Windows' "Extract All" makes the folder) with a .sha256 next to it, which
      # `nexo-server update` verifies.
      - name: Package server (Windows)
        if: runner.os == 'Windows'
        run: |
          npm run build:win -w server-cli
          version=$(node -p "require('./server-cli/package.json').version")
          name="Nexo-Server-${version}-win-x64"
          stage="server-release/$name"
          mkdir -p "$stage"
          cp server-cli/dist/win-x64/nexo-server.exe server-cli/dist/win-x64/livekit-server.exe \
             server-cli/dist/win-x64/livekit-LICENSE.txt "$stage/"
          cp LICENSE "$stage/LICENSE.txt"
          cp server-cli/README.txt "$stage/README.txt"
          # The exe must start: no SEA or bundling problem slips into a release.
          "$stage/nexo-server.exe" --version
          (cd "$stage" && 7z a -tzip "../$name.zip" ./* > /dev/null)
          (cd server-release && sha256sum "$name.zip" > "$name.zip.sha256" && cat "$name.zip.sha256")
          ls -la server-release

      # Builds the installer plus its auto-update metadata (publish config in electron-builder.yml).
      # Uploading is left to the release job.
      - name: Package installer
        working-directory: desktop
        run: npx electron-builder ${{ matrix.builder-args }} --publish never

      # electron-updater downloads <release>/download/<tag>/<path from the yml>, so the installer it names
      # must be one of the uploaded files, with exactly that name.
      - name: Check update metadata
        working-directory: desktop/release
        env:
          UPDATE_INFO: ${{ matrix.update-info }}
        run: |
          cat "$UPDATE_INFO"
          installer=$(sed -n 's/^path: *//p' "$UPDATE_INFO" | tr -d "'\"\r")
          if [[ -z "$installer" || ! -f "$installer" ]]; then
            echo "::error::$UPDATE_INFO names '$installer', which is not in desktop/release"
            exit 1
          fi
          echo "$UPDATE_INFO -> $installer"

      # The .blockmap files let Windows download only the changed parts of the next installer (the
      # AppImage embeds its block map). Each OS writes its own latest*.yml, so the names don't collide.
      - uses: actions/upload-artifact@v7
        with:
          name: nexo-${{ matrix.name }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.blockmap
            desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 14

      # Its own artifact: one artifact's files are stored relative to their common folder, so mixing
      # desktop/release and server-release would nest the installers. The release job merges nexo-* flat.
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: nexo-${{ matrix.name }}-server
          path: |
            server-release/*.zip
            server-release/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: nexo-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          # Without these, installed apps can't see the release (electron-updater reads the yml first).
          for f in latest.yml latest-mac.yml latest-linux.yml; do
            test -f "dist/$f" || { echo "::error::missing dist/$f"; exit 1; }
          done
          # The server download for hosts (nexo-server update looks for this exact name).
          version="${TAG#v}"
          for f in "Nexo-Server-$version-win-x64.zip" "Nexo-Server-$version-win-x64.zip.sha256"; do
            test -f "dist/$f" || { echo "::error::missing dist/$f"; exit 1; }
          done
          flags=()
          if [[ "$TAG" =~ -(alpha|beta|rc|test) ]]; then
            flags+=(--prerelease)
          fi
          notes=".github/release-notes/$TAG.md"
          if [[ -f "$notes" ]]; then
            flags+=(--notes-file "$notes")
          else
            flags+=(--generate-notes --notes "Nexo $TAG. Installers are unsigned; see the README.")
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "Nexo $TAG" "${flags[@]}"
          fi
